packages:
  - 'packages/*'
  - 'apps/*'
onlyBuiltDependencies:
  - '@swc/core'
  - '@node-rs/argon2'
  - esbuild
overrides:
  # One Vite for the app and Vitest, pinned to a release at least two weeks old.
  vite: 7.3.7
  # One set of Node types: apache-arrow (Blob Storage SDK) and mysql2 (Azurite) ask for newer
  # ones, and two copies split Vite's types.
  '@types/node': 24.19.2
  # tedious (SQL Server) brings @azure/identity, which brings an MSAL with a high advisory
  # (GHSA-xcx6-jx8p-x3h5, fixed in 7.1.0, released 2026-10-13). Only SQL logins are used here.
  '@azure/msal-node': 7.1.0
  # Advisories fixed on 2026-10-14 (qs) and 2026-10-18 (seroval), both over two weeks old.
  qs: 6.16.1
  seroval: 1.6.11
  # Fixes for advisories, taken before they are two weeks old because the advisories are high:
  # body-parser 2.4.0 and multer 2.5.0 (2026-10-22, both reached through @nestjs/platform-express),
  # follow-redirects 1.16.2 (2026-10-25, through Azurite), uuid 11.1.1 (through ExcelJS and Azurite).
  body-parser: 2.4.0
  multer: 2.5.0
  follow-redirects: 1.16.2
  uuid: 11.1.1
