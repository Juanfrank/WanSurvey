name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wansurvey_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - name: Respondent bundle budget
        run: pnpm --filter @wansurvey/web bundle-budget
      - run: pnpm typecheck
      # SPSS/Stata files are read back with pyreadstat and pandas (round-trip tests).
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyreadstat==1.2.8 pandas==2.2.3
      - run: pnpm test
        env:
          TEST_REDIS_URL: redis://localhost:6379/2
          REQUIRE_REDIS: '1'
          REQUIRE_PYREADSTAT: '1'
      # Managed Postgres (Azure Flexible Server) has no superuser: run the API tests with an
      # ordinary owner role too.
      - name: API tests on a database without superuser
        run: apps/api/scripts/azure-like-db.sh
      # Blocking: a high or critical advisory in a production dependency fails the build.
      # Exceptions are listed, with their reason and end date, in pnpm-workspace.yaml.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  # The SQL Server data layer (docs/roadmap.md): the T-SQL migrations and the isolation by
  # organisation, on a real SQL Server. The rest of the app still runs on PostgreSQL.
  sqlserver:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Wansurvey_Test1!
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Wansurvey_Test1!' -Q 'SELECT 1'"
          --health-interval 5s --health-retries 20 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The application starts whole in these tests, so the workspace packages it imports are built.
      - run: pnpm --filter '@wansurvey/api^...' build
      - name: Isolation tests on SQL Server
        run: pnpm --filter @wansurvey/api test:mssql
        env:
          MSSQL_ADMIN_URL: mssql://sa:Wansurvey_Test1%21@localhost:1433/wansurvey_test?trustServerCertificate=true
          MSSQL_URL: mssql://wansurvey_app:Tr0ub4dor-Stronger%21@localhost:1433/wansurvey_test?trustServerCertificate=true

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wansurvey_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @wansurvey/web exec playwright install --with-deps chromium
      # pdftotext and pdftoppm, to read the summary PDF in the E2E tests.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  # The same browser tests with the API on SQL Server (DB_ENGINE=mssql).
  e2e-mssql:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Wansurvey_Test1!
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Wansurvey_Test1!' -Q 'SELECT 1'"
          --health-interval 5s --health-retries 20 --health-start-period 20s
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      E2E_ENGINE: mssql
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @wansurvey/web exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-mssql
          path: apps/web/playwright-report

  # The zip App Service runs (Linux, Node 24, no containers): built on Linux x64 like App
  # Service, started from a clean folder against a new database, and kept as an artifact to
  # upload (Kudu → Zip Push Deploy; see docs/appservice-zip.md).
  package:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: scripts/package-appservice.sh out
      - name: Start the package as App Service would
        run: scripts/smoke-appservice.sh out/wansurvey-appservice.zip
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      - uses: actions/upload-artifact@v4
        with:
          name: wansurvey-appservice-${{ github.sha }}
          path: out/wansurvey-appservice.zip
          retention-days: 30
