# The web app in production (H4): static files with the security headers of
# apps/web/security-headers.ts, and /api proxied to the API on the same origin, so the
# session cookie stays first-party. TLS terminates in front of this (load balancer or ingress).
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # add_header in a location replaces the server's, so the headers sit where documents are
  # served (the app shell); the API sends its own.

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Live dashboards (Server-Sent Events) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 25m;
  }

  # Hashed assets never change; the app shell and service worker are always revalidated.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri /index.html;
  }
}
