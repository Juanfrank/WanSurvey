# SonarQube analysis of the whole repository (run it with a SonarQube server and a token:
# `npx @sonar/scan -Dsonar.host.url=<server>`; the token goes in SONAR_TOKEN, never in this file).
sonar.projectKey=wansurvey
sonar.projectName=WanSurvey
sonar.sources=apps/api/src,apps/web/src,apps/web/scripts,packages,infra
sonar.tests=apps/api/test,apps/web/test,apps/web/e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/test/**,**/e2e/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/.turbo/**,**/test-results/**,**/*.d.ts,**/*.test.ts,**/*.test.tsx,**/test/**
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true

# Findings read and accepted, each for one file and one rule, with its reason. Anything new still shows up.
sonar.issue.ignore.multicriteria=jitter1,jitter2,jitter3,jitter4,password1,password2,http,float,thenprop,shortcut0,shortcut1,shortcut2,shortcut3,label0,label1,label2,label3,focus,bicep1,bicep2,bicep3

# Math.random only spreads retry and sync times (jitter); nothing secret depends on it. (S2245)
sonar.issue.ignore.multicriteria.jitter1.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.jitter1.resourceKey=apps/web/src/api.ts
sonar.issue.ignore.multicriteria.jitter2.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.jitter2.resourceKey=apps/web/src/interview/*.ts
sonar.issue.ignore.multicriteria.jitter3.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.jitter3.resourceKey=apps/api/src/db/mssql/database.ts
sonar.issue.ignore.multicriteria.jitter4.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.jitter4.resourceKey=apps/api/test/mock-entra.ts

# "Contraseña" and "Repita la contraseña" are screen labels, not passwords. (S2068)
sonar.issue.ignore.multicriteria.password1.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.password1.resourceKey=apps/web/src/i18n-catalogue.ts
sonar.issue.ignore.multicriteria.password2.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.password2.resourceKey=apps/web/src/team/i18n.ts

# The mail address of the SMTP_URL setting is handed to nodemailer as it is configured. (S5332)
sonar.issue.ignore.multicriteria.http.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.http.resourceKey=apps/api/src/mail/mailer.ts

# A median absolute deviation of exactly 0 means all the values are equal: the exact test is intended. (S1244)
sonar.issue.ignore.multicriteria.float.ruleKey=typescript:S1244
sonar.issue.ignore.multicriteria.float.resourceKey=apps/api/src/metrics/metrics.ts

# `then` is the branch of an {{#if}} segment of a template, never awaited or returned from async code. (S7739)
sonar.issue.ignore.multicriteria.thenprop.ruleKey=typescript:S7739
sonar.issue.ignore.multicriteria.thenprop.resourceKey=packages/logic/src/piping.ts

# Container that catches the keyboard shortcuts of the focused control inside it (events bubble up). (S6848)
sonar.issue.ignore.multicriteria.shortcut0.ruleKey=typescript:S6848
sonar.issue.ignore.multicriteria.shortcut0.resourceKey=apps/web/src/designer/DesignerPage.tsx
sonar.issue.ignore.multicriteria.shortcut1.ruleKey=typescript:S6848
sonar.issue.ignore.multicriteria.shortcut1.resourceKey=apps/web/src/interview/InterviewPage.tsx
sonar.issue.ignore.multicriteria.shortcut2.ruleKey=typescript:S6848
sonar.issue.ignore.multicriteria.shortcut2.resourceKey=apps/web/src/routes/AccountMenu.tsx
sonar.issue.ignore.multicriteria.shortcut3.ruleKey=typescript:S6848
sonar.issue.ignore.multicriteria.shortcut3.resourceKey=packages/renderer/src/InterviewRunner.tsx

# Radio inputs inside a label whose text is a translated span the analyser cannot see. (S6853)
sonar.issue.ignore.multicriteria.label0.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.label0.resourceKey=apps/web/src/cawi/CawiTab.tsx
sonar.issue.ignore.multicriteria.label1.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.label1.resourceKey=apps/web/src/designer/LogicEditor.tsx
sonar.issue.ignore.multicriteria.label2.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.label2.resourceKey=apps/web/src/designer/ProjectPages.tsx
sonar.issue.ignore.multicriteria.label3.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.label3.resourceKey=apps/web/src/team/ProjectPeople.tsx

# The only field of the key-entry panel takes the focus when it opens. (S9379)
sonar.issue.ignore.multicriteria.focus.ruleKey=typescript:S9379
sonar.issue.ignore.multicriteria.focus.resourceKey=apps/web/src/papi/PaperTab.tsx

# Bicep: storage is encrypted by default (Microsoft-managed keys) and reached by the app identity; sign-in is the application's own (Entra ID in the API), not App Service authentication. (S6378, S6388, S6380)
sonar.issue.ignore.multicriteria.bicep1.ruleKey=azureresourcemanager:S6378
sonar.issue.ignore.multicriteria.bicep1.resourceKey=infra/azure/main.bicep
sonar.issue.ignore.multicriteria.bicep2.ruleKey=azureresourcemanager:S6388
sonar.issue.ignore.multicriteria.bicep2.resourceKey=infra/azure/main.bicep
sonar.issue.ignore.multicriteria.bicep3.ruleKey=azureresourcemanager:S6380
sonar.issue.ignore.multicriteria.bicep3.resourceKey=infra/azure/main.bicep
