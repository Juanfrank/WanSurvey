services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wansurvey
    ports: ['5432:5432']
    volumes:
      [
        'pgdata:/var/lib/postgresql/data',
        './infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ['6379:6379']
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    profiles: ['full']
    depends_on: { postgres: { condition: service_healthy } }
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgres://wansurvey_app:wansurvey_app@postgres:5432/wansurvey
      DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/wansurvey
      REDIS_URL: redis://redis:6379
    ports: ['3000:3000']
  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    profiles: ['full']
    command: ['node', 'dist/worker.js']
    # No HTTP port: the image's /health check is for the API.
    healthcheck: { disable: true }
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgres://wansurvey_app:wansurvey_app@postgres:5432/wansurvey
      REDIS_URL: redis://redis:6379
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    profiles: ['full']
    depends_on: [api]
    ports: ['8080:8080']
volumes:
  pgdata:
