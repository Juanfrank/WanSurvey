services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wansurvey
    ports: ['5432:5432']
    volumes:
      [
        'pgdata:/var/lib/postgresql/data',
        './infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ['6379:6379']
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    profiles: ['full']
    depends_on: { postgres: { condition: service_healthy } }
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgres://wansurvey_app:wansurvey_app@postgres:5432/wansurvey
      DATABASE_ADMIN_URL: postgres://postgres:postgres@postgres:5432/wansurvey
    ports: ['3000:3000']
volumes:
  pgdata:
